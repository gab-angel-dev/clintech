<div class="text-center py-5">
    <i class="bi bi-exclamation-circle agenda-error-icon"></i>
    <h3 class="mb-2 mt-3">Erro ao criar agendamento</h3>
    <p class="text-muted mb-4">{{ error }}</p>
    <button hx-get="{% url 'agenda:create' %}"
            hx-target="#form-container"
            hx-swap="innerHTML"
            class="btn btn-outline-secondary">
        Tentar novamente
    </button>
</div>
