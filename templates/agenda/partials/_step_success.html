<div data-success="true" class="text-center py-5">
    <i class="bi bi-check-circle-fill agenda-success-icon"></i>
    <h3 class="mb-2 mt-3">Agendamento confirmado!</h3>
    <p class="text-muted mb-1">{{ agendamento.procedimento.nome }} — {{ agendamento.doutor.nome }}</p>
    <p class="text-muted">{{ agendamento.start_time|date:"d/m/Y" }} às {{ agendamento.start_time|date:"H:i" }}</p>
    <a href="{% url 'agenda:agenda' %}" class="btn btn-primary mt-3">Voltar para a agenda</a>
</div>
<script>
    setTimeout(function () {
        window.location.href = "{% url 'agenda:agenda' %}";
    }, 2000);
</script>
