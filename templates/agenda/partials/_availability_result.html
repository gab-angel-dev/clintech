{% if error %}
    <div class="alert alert-danger py-2 px-3 small mb-0">{{ error }}</div>
{% elif available %}
    <div class="agenda-availability agenda-availability-ok">
        <span class="agenda-availability-dot"></span> Horário disponível
    </div>
{% else %}
    <div class="agenda-availability agenda-availability-conflict">
        <span class="agenda-availability-dot"></span> Conflito: {{ conflict.summary }}
    </div>
{% endif %}
