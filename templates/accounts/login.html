{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    <title>ClinTech</title>

</head>
<body>
    <main class="auth-page">
        <h1 class="auth-title">ClinTech</h1>
        <div class="auth-card">
            <form action="{% url 'accounts:login' %}" method="post">
                {% csrf_token %}


                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="text" class="form-input" id="email" name="email" placeholder="seu@email.com">
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" class="form-input" id="password" placeholder="••••••" name="password">
                </div>

                {% if error %}
                <p class="auth-error">{{ error }}</p>
                {% endif %}

                <button type="submit" class="btn-submit">Logar</button>

            </form>

            <p class="auth-switch">
                Anda não tem uma conta? <a href="{% url 'accounts:cadastro' %}">Cadastre-se</a>
            </p>

        </div>
    </main>
</body>
</html>
