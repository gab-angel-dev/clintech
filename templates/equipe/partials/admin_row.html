<tr id="admin-row-{{ adm.pk }}">
    <td class="fw-semibold">{{ adm.username }}</td>
    <td class="text-muted">{{ adm.email|default:"—" }}</td>
    <td class="text-muted">{{ adm.created_at|date:"d/m/Y" }}</td>

    <td>
        <div class="form-check form-switch mb-0">
            <input type="checkbox"
                   class="form-check-input admin-status-switch"
                   role="switch"
                   hx-post="{% url 'equipe:admin_toggle_ativo' adm.pk %}"
                   hx-target="#admin-row-{{ adm.pk }}"
                   hx-swap="outerHTML"
                   {% if adm.is_active %}checked{% endif %}>
        </div>
    </td>

    <td class="text-end">
        <div class="admin-row-actions">
            <a href="{% url 'equipe:admin_editar' adm.pk %}" class="btn btn-light btn-sm" title="Editar">
                <i class="bi bi-pencil"></i>
            </a>
            <a href="{% url 'equipe:admin_senha' adm.pk %}" class="btn btn-light btn-sm" title="Alterar senha">
                <i class="bi bi-key"></i>
            </a>
            <button type="button"
                    class="btn btn-outline-danger btn-sm"
                    hx-delete="{% url 'equipe:admin_deletar' adm.pk %}"
                    hx-target="closest tr"
                    hx-swap="outerHTML"
                    hx-confirm="Tem certeza que deseja excluir esse admin?"
                    title="Excluir">
                <i class="bi bi-trash3"></i>
            </button>
        </div>
    </td>
</tr>
