{% extends 'home.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Alterar Senha{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/equipe.css' %}">
{% endblock %}

{% block content %}

    <div class="page-header">
        <div>
            <a href="{% url 'equipe:equipe' %}" class="back-link">
                <i class="bi bi-arrow-left"></i> Equipe
            </a>
            <h1>Alterar senha</h1>
            <p class="page-subtitle">{{ admin.username }}</p>
        </div>
    </div>

    <div class="card form-card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}

                <div class="d-flex justify-content-end gap-2 mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-shield-lock"></i> Salvar nova senha
                    </button>
                </div>
            </form>
        </div>
    </div>

{% endblock %}
