{% extends 'home.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Novo Arquivo{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/arquivos.css' %}">
{% endblock %}

{% block content %}

    <div class="page-header">
        <div>
            <a href="{% url 'arquivos:arquivos' %}" class="back-link">
                <i class="bi bi-arrow-left"></i> Arquivos
            </a>
            <h1>Novo Arquivo</h1>
        </div>
    </div>

    <div class="card form-card">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}

                <div class="d-flex justify-content-end gap-2 mt-3">
                    <a href="{% url 'arquivos:arquivos' %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-upload"></i> Enviar
                    </button>
                </div>
            </form>
        </div>
    </div>

{% endblock %}
